<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发帖编辑页</title>
    <style id="theme-vars">
/* AI 辅助论坛原型 —— 现代极简设计系统 */

:root {
  /* === 品牌主色：深蓝灰，克制而有力 === */
  --af-brand-50: #f8fafc;
  --af-brand-100: #f1f5f9;
  --af-brand-200: #e2e8f0;
  --af-brand-300: #cbd5e1;
  --af-brand-400: #94a3b8;
  --af-brand-500: #64748b;
  --af-brand-600: #475569;
  --af-brand-700: #334155;
  --af-brand-800: #1e293b;
  --af-brand-900: #0f172a;

  /* === 中性灰阶 === */
  --af-gray-0: #ffffff;
  --af-gray-50: #fafafa;
  --af-gray-100: #f5f5f5;
  --af-gray-200: #e5e5e5;
  --af-gray-300: #d4d4d4;
  --af-gray-400: #a3a3a3;
  --af-gray-500: #737373;
  --af-gray-600: #525252;
  --af-gray-700: #404040;
  --af-gray-800: #262626;
  --af-gray-900: #171717;
  --af-gray-950: #0a0a0a;

  /* === 语义 Token（Light Mode） === */
  --af-background: var(--af-gray-50);
  --af-foreground: var(--af-gray-950);
  --af-card: var(--af-gray-0);
  --af-card-foreground: var(--af-gray-950);
  --af-popover: var(--af-gray-0);
  --af-popover-foreground: var(--af-gray-950);
  --af-primary: var(--af-gray-950);
  --af-primary-foreground: var(--af-gray-0);
  --af-secondary: var(--af-gray-100);
  --af-secondary-foreground: var(--af-gray-900);
  --af-muted: var(--af-gray-100);
  --af-muted-foreground: var(--af-gray-500);
  --af-border: var(--af-gray-200);
  --af-input: var(--af-gray-200);
  --af-ring: var(--af-gray-950);
  --af-radius-small: 4px;
  --af-radius-medium: 8px;
  --af-radius-large: 12px;
  --af-radius-xlarge: 16px;

  /* === 状态色（仅用于状态/验证/操作反馈） === */
  --af-state-success: #16a34a;
  --af-state-success-bg: #f0fdf4;
  --af-state-warning: #ca8a04;
  --af-state-warning-bg: #fefce8;
  --af-state-error: #dc2626;
  --af-state-error-bg: #fef2f2;
  --af-state-info: #2563eb;
  --af-state-info-bg: #eff6ff;

  /* === 表面与阴影 === */
  --af-surface: var(--af-gray-0);
  --af-surface-2: var(--af-gray-100);
  --af-ink: var(--af-gray-950);
  --af-ink-2: var(--af-gray-600);
  --af-ink-3: var(--af-gray-400);
  --af-line: var(--af-gray-200);
  --af-brand: var(--af-gray-950);
  --af-brand-ink: var(--af-gray-0);

  --af-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --af-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.14);
  --af-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.24);

  /* === 字体系统 === */
  --af-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --af-font-mono: "JetBrains Mono", "SF Mono", "Fira Code", monospace;

  /* === 间距系统（8pt 网格） === */
  --af-space-1: 4px;
  --af-space-2: 8px;
  --af-space-3: 12px;
  --af-space-4: 16px;
  --af-space-5: 24px;
  --af-space-6: 32px;
  --af-space-7: 48px;
  --af-space-8: 64px;
  --af-space-9: 96px;
}

/* === Dark Mode（通过父级 class 切换） === */
.dark {
  --af-background: var(--af-gray-950);
  --af-foreground: var(--af-gray-50);
  --af-card: var(--af-gray-900);
  --af-card-foreground: var(--af-gray-50);
  --af-popover: var(--af-gray-900);
  --af-popover-foreground: var(--af-gray-50);
  --af-primary: var(--af-gray-0);
  --af-primary-foreground: var(--af-gray-950);
  --af-secondary: var(--af-gray-800);
  --af-secondary-foreground: var(--af-gray-100);
  --af-muted: var(--af-gray-800);
  --af-muted-foreground: var(--af-gray-400);
  --af-border: var(--af-gray-800);
  --af-input: var(--af-gray-800);
  --af-ring: var(--af-gray-100);

  --af-surface: var(--af-gray-900);
  --af-surface-2: var(--af-gray-800);
  --af-ink: var(--af-gray-50);
  --af-ink-2: var(--af-gray-400);
  --af-ink-3: var(--af-gray-600);
  --af-line: var(--af-gray-800);
  --af-brand: var(--af-gray-0);
  --af-brand-ink: var(--af-gray-950);

  --af-state-success: #22c55e;
  --af-state-success-bg: rgba(34, 197, 94, 0.12);
  --af-state-warning: #eab308;
  --af-state-warning-bg: rgba(234, 179, 8, 0.12);
  --af-state-error: #ef4444;
  --af-state-error-bg: rgba(239, 68, 68, 0.12);
  --af-state-info: #3b82f6;
  --af-state-info-bg: rgba(59, 130, 246, 0.12);

  --af-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.2), 0 1px 1px rgba(0, 0, 0, 0.16);
  --af-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.4);
  --af-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.5);
}

/* === 基础排版工具类 === */
.font-sans { font-family: var(--af-font-sans); }
.font-mono { font-family: var(--af-font-mono); }

/* === 滚动条极简样式 === */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--af-gray-300); border-radius: 3px; }
.dark ::-webkit-scrollbar-thumb { background: var(--af-gray-700); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {

    --color-foreground: var(--af-foreground);
    --color-card: var(--af-card);
    --color-card-foreground: var(--af-card-foreground);
    --color-popover: var(--af-popover);
    --color-popover-foreground: var(--af-popover-foreground);
    --color-primary: var(--af-primary);
    --color-primary-foreground: var(--af-primary-foreground);
    --color-secondary: var(--af-secondary);
    --color-secondary-foreground: var(--af-secondary-foreground);
    --color-muted: var(--af-muted);
    --color-muted-foreground: var(--af-muted-foreground);
    --color-border: var(--af-border);
    --color-input: var(--af-input);
    --color-ring: var(--af-ring);
    --radius-sm: var(--af-radius-small);
    --radius-md: var(--af-radius-medium);
    --radius-lg: var(--af-radius-large);
    --radius-xl: var(--af-radius-xlarge);
  }
  @layer base {
    body { background: var(--af-background); color: var(--af-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

<body class="min-h-screen font-sans antialiased">
    <main id="page-editor" data-page-type="task-driven" class="flex min-h-screen flex-col bg-background text-foreground">
      <!-- 登录态校验提示 -->
      <div class="border-b border-border bg-muted px-4 py-2 text-sm text-muted-foreground">
        <div class="container mx-auto flex items-center gap-2">
          <i data-lucide="shield-check" class="h-4 w-4"></i>
          <span>已登录为 <strong class="text-foreground">AlexChen</strong></span>
        </div>
      </div>

      <!-- 顶部简化导航栏 -->
      <header class="sticky top-0 z-50 border-b border-border bg-card/80 backdrop-blur">
        <div class="container mx-auto flex h-14 items-center justify-between px-4">
          <div class="flex items-center gap-3">
            <a data-dom-id="nav-logo" href="index.html" class="flex items-center gap-2 text-lg font-semibold text-foreground hover:opacity-80">
              <i data-lucide="message-square" class="h-5 w-5"></i>
              AI Forum
            </a>
            <span class="h-4 w-px bg-border"></span>
            <a data-dom-id="nav-back" href="index.html" class="inline-flex items-center gap-1 text-sm text-muted-foreground hover:text-foreground">
              <i data-lucide="arrow-left" class="h-4 w-4"></i>
              返回首页
            </a>
          </div>
          <a data-dom-id="nav-search" href="search.html" class="flex h-8 w-8 items-center justify-center rounded-full border border-border bg-background text-muted-foreground ring-2 ring-transparent hover:bg-muted hover:text-foreground hover:ring-border focus-visible:ring-ring" aria-label="搜索">
            <i data-lucide="search" class="h-4 w-4"></i>
          </a>
          <a data-dom-id="nav-profile" href="profile.html" class="flex h-8 w-8 items-center justify-center rounded-full bg-foreground text-primary-foreground ring-2 ring-transparent hover:ring-border focus-visible:ring-ring">
            <i data-lucide="user" class="h-4 w-4"></i>
          </a>
        </div>
      </header>

      <!-- 编辑区与 AI 助手 -->
      <div class="flex-1">
        <div class="container mx-auto px-4 py-6">
          <div class="grid grid-cols-1 gap-6 lg:grid-cols-[1fr_22.5rem] lg:items-start">
            <!-- 主编辑区 -->
            <section class="rounded-xl border border-border bg-card p-5 shadow-sm md:p-6">
              <div class="space-y-5">
                <!-- 标题 -->
                <div>
                  <label for="post-title" class="mb-2 block text-sm font-medium text-foreground">标题</label>
                  <input id="post-title" type="text" placeholder="用一句话概括你的问题或观点" class="w-full rounded-lg border border-input bg-background px-4 py-3 text-lg text-foreground placeholder:text-muted-foreground focus:border-ring focus:outline-none focus-visible:ring-2 focus-visible:ring-ring" />
                </div>

                <!-- 正文编辑器占位 -->
                <div>
                  <label for="post-body" class="mb-2 block text-sm font-medium text-foreground">正文</label>
                  <div class="overflow-hidden rounded-lg border border-input bg-background">
                    <!-- 占位 toolbar -->
                    <div class="flex items-center gap-1 border-b border-border bg-muted/50 px-3 py-2">
                      <button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded text-muted-foreground hover:bg-secondary hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring">
                        <i data-lucide="bold" class="h-4 w-4"></i>
                      </button>
                      <button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded text-muted-foreground hover:bg-secondary hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring">
                        <i data-lucide="list" class="h-4 w-4"></i>
                      </button>
                      <button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded text-muted-foreground hover:bg-secondary hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring">
                        <i data-lucide="link" class="h-4 w-4"></i>
                      </button>
                      <button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded text-muted-foreground hover:bg-secondary hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring">
                        <i data-lucide="image" class="h-4 w-4"></i>
                      </button>
                    </div>
                    <textarea id="post-body" rows="12" placeholder="详细描述你的想法，支持 Markdown 风格输入…" class="w-full resize-y bg-background px-4 py-3 text-foreground placeholder:text-muted-foreground focus:outline-none"></textarea>
                  </div>
                </div>

                <!-- 版块选择 -->
                <div>
                  <label for="post-board" class="mb-2 block text-sm font-medium text-foreground">选择版块</label>
                  <div class="relative">
                    <select id="post-board" class="w-full appearance-none rounded-lg border border-input bg-background px-4 py-2.5 pr-10 text-foreground focus:border-ring focus:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                      <option value="">请选择版块</option>
                      <option value="ai-news" selected>AI 新闻</option>
                      <option value="prompt-engineering">Prompt 工程</option>
                      <option value="model-discussion">模型讨论</option>
                      <option value="showcase">作品展示</option>
                      <option value="help">新手求助</option>
                    </select>
                    <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"></i>
                  </div>
                </div>

                <!-- 标签输入 -->
                <div>
                  <label for="post-tags" class="mb-2 block text-sm font-medium text-foreground">标签</label>
                  <div class="flex flex-wrap items-center gap-2 rounded-lg border border-input bg-background px-3 py-2 focus-within:border-ring focus-within:ring-2 focus-within:ring-ring">
                    <span class="inline-flex items-center gap-1 rounded-full bg-secondary px-2.5 py-1 text-xs font-medium text-secondary-foreground">
                      大模型
                      <button type="button" class="inline-flex h-3.5 w-3.5 items-center justify-center rounded-full hover:bg-foreground/10" aria-label="移除标签">
                        <i data-lucide="x" class="h-3 w-3"></i>
                      </button>
                    </span>
                    <span class="inline-flex items-center gap-1 rounded-full bg-secondary px-2.5 py-1 text-xs font-medium text-secondary-foreground">
                      讨论
                      <button type="button" class="inline-flex h-3.5 w-3.5 items-center justify-center rounded-full hover:bg-foreground/10" aria-label="移除标签">
                        <i data-lucide="x" class="h-3 w-3"></i>
                      </button>
                    </span>
                    <input id="post-tags" type="text" placeholder="输入标签后按回车" class="min-w-[8rem] flex-1 bg-transparent py-1 text-sm text-foreground placeholder:text-muted-foreground focus:outline-none" />
                  </div>
                </div>
              </div>
            </section>

            <!-- AI 发帖助手面板 -->
            <aside class="space-y-4 lg:sticky lg:top-20">
              <div class="rounded-xl border border-border bg-card p-5 shadow-sm">
                <div class="mb-4 flex items-center gap-2 text-sm font-semibold text-foreground">
                  <i data-lucide="sparkles" class="h-4 w-4 text-muted-foreground"></i>
                  AI 发帖助手
                </div>

                <div class="space-y-5">
                  <!-- 标题建议 -->
                  <div>
                    <p class="mb-2 text-xs font-medium text-muted-foreground">AI 标题建议</p>
                    <div class="space-y-2">
                      <button data-dom-id="ai-suggest-title-1" type="button" class="w-full rounded-lg border border-border bg-background px-3 py-2 text-left text-sm text-foreground hover:bg-secondary focus-visible:ring-2 focus-visible:ring-ring">
                        如何设计一个稳定的 Prompt 模板？
                      </button>
                      <button data-dom-id="ai-suggest-title-2" type="button" class="w-full rounded-lg border border-border bg-background px-3 py-2 text-left text-sm text-foreground hover:bg-secondary focus-visible:ring-2 focus-visible:ring-ring">
                        Prompt 工程中常被忽略的三个细节
                      </button>
                      <button data-dom-id="ai-suggest-title-3" type="button" class="w-full rounded-lg border border-border bg-background px-3 py-2 text-left text-sm text-foreground hover:bg-secondary focus-visible:ring-2 focus-visible:ring-ring">
                        从 LLM 输出中保持结构稳定的经验
                      </button>
                    </div>
                  </div>

                  <!-- 标签建议 -->
                  <div>
                    <p class="mb-2 text-xs font-medium text-muted-foreground">标签建议</p>
                    <div class="flex flex-wrap gap-2">
                      <button type="button" class="rounded-full border border-border bg-background px-2.5 py-1 text-xs text-foreground hover:bg-secondary focus-visible:ring-2 focus-visible:ring-ring">Prompt</button>
                      <button type="button" class="rounded-full border border-border bg-background px-2.5 py-1 text-xs text-foreground hover:bg-secondary focus-visible:ring-2 focus-visible:ring-ring">LLM</button>
                      <button type="button" class="rounded-full border border-border bg-background px-2.5 py-1 text-xs text-foreground hover:bg-secondary focus-visible:ring-2 focus-visible:ring-ring">最佳实践</button>
                    </div>
                  </div>

                  <!-- 版块建议 -->
                  <div>
                    <p class="mb-2 text-xs font-medium text-muted-foreground">版块建议</p>
                    <button type="button" class="inline-flex w-full items-center justify-between rounded-lg border border-border bg-background px-3 py-2 text-sm text-foreground hover:bg-secondary focus-visible:ring-2 focus-visible:ring-ring">
                      <span>Prompt 工程</span>
                      <i data-lucide="arrow-right" class="h-4 w-4 text-muted-foreground"></i>
                    </button>
                  </div>

                  <!-- 隐私提醒 -->
                  <div class="rounded-lg border border-border bg-muted p-3">
                    <div class="flex gap-3">
                      <i data-lucide="shield-alert" class="mt-0.5 h-4 w-4 shrink-0 text-muted-foreground"></i>
                      <div>
                        <p class="text-xs font-medium text-foreground">隐私提醒</p>
                        <p class="mt-1 text-xs text-muted-foreground">检测到内容中可能包含手机号、地址等敏感信息，发布前请注意脱敏。</p>
                      </div>
                    </div>
                  </div>

                  <!-- 内容润色 -->
                  <button type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-foreground bg-card px-4 py-2.5 text-sm font-medium text-foreground hover:bg-foreground hover:text-primary-foreground focus-visible:ring-2 focus-visible:ring-ring">
                    <i data-lucide="wand-2" class="h-4 w-4"></i>
                    内容润色
                  </button>
                </div>
              </div>
            </aside>
          </div>
        </div>
      </div>

      <!-- 预览与发布栏 -->
      <div class="sticky bottom-0 z-40 border-t border-border bg-card/90 backdrop-blur">
        <div class="container mx-auto flex items-center justify-between gap-3 px-4 py-3">
          <a data-dom-id="btn-cancel" href="index.html" class="inline-flex items-center justify-center rounded-lg border border-border bg-background px-4 py-2 text-sm font-medium text-foreground hover:bg-secondary focus-visible:ring-2 focus-visible:ring-ring">
            取消
          </a>
          <div class="flex items-center gap-3">
            <button type="button" class="hidden items-center justify-center rounded-lg border border-border bg-background px-4 py-2 text-sm font-medium text-foreground hover:bg-secondary focus-visible:ring-2 focus-visible:ring-ring sm:inline-flex">
              保存草稿
            </button>
            <button type="button" class="inline-flex items-center justify-center rounded-lg border border-border bg-background px-4 py-2 text-sm font-medium text-foreground hover:bg-secondary focus-visible:ring-2 focus-visible:ring-ring">
              预览
            </button>
            <a data-dom-id="btn-publish" href="post.html" class="inline-flex items-center justify-center rounded-lg bg-foreground px-5 py-2 text-sm font-medium text-primary-foreground shadow hover:bg-foreground/90 focus-visible:ring-2 focus-visible:ring-ring">
              发布
            </a>
          </div>
        </div>
      </div>
    </main>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // AI 标题建议点击后填充标题输入框
        var titleInput = document.getElementById('post-title');
        ['ai-suggest-title-1', 'ai-suggest-title-2', 'ai-suggest-title-3'].forEach(function (id) {
          var btn = document.querySelector('[data-dom-id="' + id + '"]');
          if (btn && titleInput) {
            btn.addEventListener('click', function () {
              titleInput.value = btn.textContent.trim();
              titleInput.focus();
            });
          }
        });
        lucide.createIcons();
      });
    </script>
</body>
</html>
